[package]
name = "ibkr"
version = "0.3.0"
edition = "2024"
description = "Minimal request against the Interactive Brokers Client Portal Web API"
license = "AGPL-3.0"
repository = "https://github.com/AG3NTZ3R0/ibkr"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
