name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # mint a short-lived crates.io token via OIDC
      contents: write # push the version tag
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup update stable --no-self-update && rustup default stable

      - name: Resolve version
        id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          echo "value=$version" >> "$GITHUB_OUTPUT"
          if curl -sSf -H 'User-Agent: ibkr-release (github actions)' \
               https://crates.io/api/v1/crates/ibkr/versions \
             | jq -e --arg v "$version" '.versions[] | select(.num == $v)' > /dev/null; then
            echo "$version is already on crates.io, nothing to publish."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        if: steps.version.outputs.publish
        run: cargo test --all-features

      - uses: rust-lang/crates-io-auth-action@v1
        if: steps.version.outputs.publish
        id: auth

      - name: Publish
        if: steps.version.outputs.publish
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Tag
        if: steps.version.outputs.publish
        run: |
          git tag "v${{ steps.version.outputs.value }}"
          git push origin "v${{ steps.version.outputs.value }}"
